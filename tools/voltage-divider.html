<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voltage divider | EE Tools Portal</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js"></script>
  <script src="../js/voltage-divider.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="../index.html">EE Tools Portal</a>
    <button id="theme-toggle" type="button">Switch to dark theme</button>
  </header>
  <main>
    <p><a href="../index.html">&larr; Back to all tools</a></p>
    <h1>Voltage divider</h1>
    <p class="muted">A voltage divider uses two resistors to take a fraction of a voltage. Enter the input voltage and both resistors, then press Calculate.</p>

    <form id="divider-form" novalidate>
      <div class="field">
        <label for="vin">Input voltage, Vin (volts)</label>
        <input id="vin" type="number" step="any" inputmode="decimal">
      </div>

      <div class="field">
        <label for="r1">Resistor R1</label>
        <div class="field-row">
          <input id="r1" type="number" step="any" inputmode="decimal">
          <select id="r1-unit" aria-label="R1 unit">
            <option value="1">&Omega;</option>
            <option value="1000" selected>k&Omega;</option>
            <option value="1000000">M&Omega;</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="r2">Resistor R2</label>
        <div class="field-row">
          <input id="r2" type="number" step="any" inputmode="decimal">
          <select id="r2-unit" aria-label="R2 unit">
            <option value="1">&Omega;</option>
            <option value="1000" selected>k&Omega;</option>
            <option value="1000000">M&Omega;</option>
          </select>
        </div>
      </div>

      <button type="submit">Calculate</button>
    </form>

    <div id="result" class="result" aria-live="polite"></div>
  </main>
</body>
</html>
